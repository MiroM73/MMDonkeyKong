[package]
name = "mmdonkeykong"
version = "0.1.0"
edition = "2024"
license = "Unlicense"
description = "Donkey Kong style platform game"
repository = "https://github.com/MiroM73/MMDonkeyKong"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"

# Desktop: OpenGL (glow) with the default eframe features (wgpu fallback, clipboard, ...).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.37", features = ["glow"] }
dirs = "6"
# Gamepad (issue #9).
gilrs = "0.11"

# Browser (wasm32, built with Trunk, see docs/platforms.md): WebGL through glow only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
wasm-bindgen-futures = "0.4"
# Vibration on a hit (navigator.vibrate), Web Audio for the sound.
web-sys = { version = "0.3", features = ["Window", "Navigator", "Gamepad", "GamepadButton", "Storage", "AudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioDestinationNode", "AudioNode", "AudioParam", "GainNode"] }
# The "js" feature reads navigator.language in the browser (without it the language is never found).
sys-locale = { version = "0.3", features = ["js"] }
# Add when needed (versions as used in RusTrace / MM PortLens):
#   egui_extras = "0.37"   regex = "1"   rfd = "0.17"   open = "5"   chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
#   sha2 = "0.11"   flate2 = "1"   crc32fast = "1"   egui_plot = "0.38"   memmap2 = "0.9"   encoding_rs = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[build-dependencies]
winresource = "0.1"
