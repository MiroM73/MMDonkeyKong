# Checks every push to master and every pull request:
# - Windows (the main platform): formatting, clippy, tests and a release build uploaded as an artifact
# - Linux: clippy and tests, so the non-Windows build keeps working
# - Web: clippy for wasm32 and a Trunk build, so the browser version cannot rot
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch / pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update Rust toolchain
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v7
        with:
          name: mmdonkeykong-windows-${{ github.sha }}
          path: target/release/mmdonkeykong.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update Rust toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  web:
    runs-on: ubuntu-latest
    env:
      TRUNK_VERSION: v0.22.2
      TRUNK_SHA256: 26fca8a9952e46cd7d8b8b9a2e2c1786c090fc14b8e10b6678ab4d0f9f1a385f
    steps:
      - uses: actions/checkout@v5

      - name: Update Rust toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy && rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (wasm32)
        run: cargo clippy --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Install Trunk
        run: |
          curl -sSfL -o trunk.tar.gz "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TRUNK_SHA256}  trunk.tar.gz" | sha256sum -c -
          tar -xzf trunk.tar.gz trunk
          sudo mv trunk /usr/local/bin/trunk

      - name: Build (Trunk)
        run: trunk build --release --public-url "/MMDonkeyKong/"
